name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      # A least-privilege role and the customers/sales fixtures live in
      # docker/postgres-init.sql, which docker/postgres.yml mounts for local
      # development - a GitHub Actions service container takes no volumes,
      # so it cannot be mounted here. The "Apply the PostgreSQL init script"
      # step below runs it instead, against this container's superuser
      # bootstrap account (POSTGRES_PASSWORD).
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aipa
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aipa"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      # aipa_ro, not the postgres superuser above: PostgresEngine.
      # check_reachable() refuses a superuser DSN with EngineForbiddenError
      # (2026-09-26 decision - see docker/postgres-init.sql), so the test
      # suite must connect the same least-privilege way a real deployment
      # would, or every PostgreSQL test and the conformance suite's
      # PostgreSQL third would fail closed here too.
      AIPA_TEST_POSTGRES_DSN: postgresql://aipa_ro:aipa_ro_pw@localhost:5432/aipa
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --extra engines

      - name: Apply the PostgreSQL init script
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
          psql -h localhost -U postgres -d aipa -f docker/postgres-init.sql

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest

      - name: Fail if any conformance test was skipped
        # importorskip("duckdb") would otherwise let every DuckDB conformance
        # test silently skip and this job would go green having tested
        # nothing - the same failure mode the `engines` extra above exists to
        # prevent. Phase 3b's PostgreSQL third can skip the same way if
        # `AIPA_TEST_POSTGRES_DSN` above ever stops resolving (a broken
        # service container, an unapplied init script, a role the engine
        # refuses) - `postgres_dsn` (tests/conftest.py) skips rather than
        # erroring in that case, so this guard is what turns that skip back
        # into a build failure. `-rs` prints a SKIPPED line per skip;
        # grep -q finding one fails the step. `pytest -m conformance` exits 0
        # on an all-skipped run, so this cannot rely on pytest's own exit code.
        run: |
          uv run --python ${{ matrix.python-version }} pytest -m conformance -rs \
            | tee /tmp/conformance.out
          if grep -q '^SKIPPED' /tmp/conformance.out; then
            echo "::error::a conformance test was skipped - is the 'engines' extra installed and the PostgreSQL service container reachable?"
            exit 1
          fi

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra engines

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy text_to_sql_agent

      - name: requirements.txt is not stale
        run: |
          uv export --no-hashes --no-dev --no-emit-project -o /tmp/requirements.check
          strip() { grep -vE '^[[:space:]]*#' "$1" | grep -vE '^[[:space:]]*$'; }
          diff -u <(strip requirements.txt) <(strip /tmp/requirements.check)
        shell: bash
